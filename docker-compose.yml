services:
  store-api:
    build:
      context: ./api
    container_name: store-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  store-dashboard:
    build:
      context: ./dashboard
    container_name: store-dashboard
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: "http://store-api:8000"
      STORE_OPTIONS: "ST1008,STORE_2"
    depends_on:
      store-api:
        condition: service_healthy

  cv-worker:
    build:
      context: ./cv_pipeline
    container_name: cv-worker
    profiles:
      - cv
    environment:
      API_URL: "http://store-api:8000/events/ingest"
      YOLO_MODEL: "yolov8n.pt"
      FRAME_SKIP: "${FRAME_SKIP:-1}"
      DEBUG_EVENTS: "${DEBUG_EVENTS:-0}"
      ONLY_STORE: "${CV_ONLY_STORE:-}"
      EVENT_BATCH_SIZE: "${EVENT_BATCH_SIZE:-50}"
    volumes:
      - ./data:/app/data
    depends_on:
      store-api:
        condition: service_healthy