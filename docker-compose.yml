services:
  store-api:
    build:
      context: ./api
    container_name: store-api
    ports:
      - "8000:8000"
    volumes:
      # Mount challenge data so api/seed_data.py can read the POS CSV.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  store-dashboard:
    build:
      context: ./dashboard
    container_name: store-dashboard
    ports:
      - "8501:8501"
    depends_on:
      store-api:
        condition: service_healthy